[package]
name = "cpu-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
readme = "README.md"
description = "A modern, pretty CPU viewer: see what silicon you are actually running"
keywords = ["cpu", "lscpu", "hardware", "cli", "topology"]
categories = ["command-line-utilities", "hardware-support"]

[[bin]]
name = "cpu"
path = "src/main.rs"

[dependencies]
anstyle = "1.0"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
toml = "1.1"
unicode-width = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

[dev-dependencies]
insta = "1.48"
jsonschema = { version = "0.57", default-features = false }
tempfile = "3.27"
