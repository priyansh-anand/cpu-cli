# How `cpu` shows CPU feature flags.
#
# Each entry maps a raw flag, spelled exactly as the OS reports it, to a display name and a group.
# Flags without an entry still appear in `--json` under `features.raw`, but not in the table, so
# the table stays a curated summary instead of a dump. Entries are shown in file order.
#
# group: simd | crypto | virtualization | security | other
# arch: optional, "arm" or "x86". An entry with an arch only matches that architecture; one
#   without (such as aes) means the same thing on both.
# family: optional. Consecutive members of a family display as one item, e.g. AVX-512 (F/BW/VL).
#
# Raw keys are shared across operating systems and architectures, so a key must mean the same
# thing everywhere. AMD's "sme" (Secure Memory Encryption) is deliberately absent because ARM's
# "sme" is the Scalable Matrix Extension.

# --- macOS on Apple Silicon: hw.optional.arm.* ---

