# Dependency policy, checked by `cargo deny check` locally and in CI.

# Only the graph that ships: the four release targets.
[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]

[advisories]
version = 2
yanked = "deny"

# Every licence here is compatible with distributing the binary under GPL-3.0-or-later.
# Apache-2.0 is GPL-3.0 compatible (not GPL-2.0). Adding a licence is a deliberate review step.
[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "GPL-3.0-or-later",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
